openapi: 3.1.0
info:
  title: SCORM Engine API
  version: 0.1.0
  summary: Modern SCORM runtime + tracking engine for TypeScript applications.
  description: |
    The SCORM Engine API is a **vendor-neutral REST contract** for SCORM 1.2 and
    SCORM 2004 course ingestion, runtime tracking, and analytics. It is the
    primary contract for our client SDK (`scorm-engine-client`), but the API is
    designed to be consumed by **any HTTP client**.

    The engine ships static-asset routes (`/play/:attemptId`, `/runtime.js`) that
    bridge browser-side SCOs to the API. The runtime bridge is a **clean-room,
    spec-compliant implementation of the SCORM JavaScript API** — it has no
    third-party SCORM dependencies. Because it follows the spec, any SCORM-compliant
    course works regardless of the authoring tool or API wrapper it was built with.

    ## Versioning
    The API is versioned via the URL prefix (`/api/v1`). Breaking changes ship under
    a new prefix. Additive changes (new optional fields, new endpoints) are non-breaking.

    ## Authentication
    Two auth modes:
    - **API key** (`X-API-Key` header): service-to-service calls from an LMS backend.
    - **Attempt JWT** (`Authorization: Bearer <jwt>`): short-lived token scoped to
      a single attempt, used by the in-browser player. Issued by `/auth/attempt-token`.

    ## Tenancy
    Every resource is scoped to a tenant resolved from the API key. Attempt JWTs
    inherit the tenant of the API key that issued them. Uploaded content is stored
    under a per-tenant prefix (`tenants/<tenantId>/`), optionally beneath a
    deployment-wide `STORAGE_PREFIX`.

    ## Rate limiting
    When the operator sets `RATE_LIMIT_MAX`, each tenant may make that many
    authenticated requests per `RATE_LIMIT_WINDOW_SECONDS` window — one budget
    shared by all of its API keys, attempt tokens and cmi5 sessions. Counted
    responses carry `X-RateLimit-Limit`, `X-RateLimit-Remaining` and
    `X-RateLimit-Reset` (seconds until the window refills). A request over budget
    gets `429` with code `rate_limited` and a `Retry-After` header, and was not
    processed, so it is safe to retry after that delay. Limits are enforced per
    engine instance.
  contact:
    name: SCORM Engine
    url: https://github.com/scorm-engine
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000/api/v1
    description: Local development
  - url: https://api.example.com/api/v1
    description: Production (placeholder)

tags:
  - name: Courses
    description: Upload, list, and manage SCORM packages.
  - name: Attempts
    description: Learner sessions against a course.
  - name: Runtime
    description: SCORM runtime API — called by the in-browser player bridge.
  - name: Analytics
    description: Aggregated progress and performance data.
  - name: LRS
    description: |
      Built-in Learning Record Store implementing the xAPI 1.0.3 Statement,
      State, Activity Profile, Agent Profile, Activity, Agent and About
      resources under `/xapi`.

      Three deliberate departures from a stock LRS:
      - **Auth** is this engine's `X-API-Key` header instead of xAPI's Basic/OAuth,
        so the LRS shares one tenancy model with courses and attempts.
      - **Paging** uses an opaque `cursor` query parameter; follow the `more`
        link verbatim rather than constructing it.
      - **Activity and Agent lookups** are derived from stored statements rather
        than from a separate registry, since this LRS keeps no such registry.

      **Attachments** travel as `multipart/mixed`: the statement JSON first,
      then one part per attachment body with `Content-Transfer-Encoding: binary`
      and `X-Experience-API-Hash` set to its SHA-2 digest. Bodies are stored
      content-addressed per tenant and returned by `GET /xapi/statements` with
      `attachments=true`. Signature attachments (JWS, RS256/384/512) are checked
      against the statement they sign, and verified cryptographically when they
      embed an `x5c` certificate.

      A cmi5 AU authenticates with the session token its fetch URL issued
      (`Authorization: Basic …`). Such a token only reaches its own learner and
      registration, and statements sent with it must obey the cmi5 statement
      rules — violations are a `403`.
  - name: cmi5
    description: |
      cmi5 course hosting: import a course structure, register learners, launch
      AUs, and track moveOn satisfaction. The engine plays the LMS role; AUs talk
      to the built-in LRS directly.
  - name: Webhooks
    description: |
      Register HTTPS endpoints for engine events (course completions, score
      changes, cmi5 satisfaction, …). Every delivery is a `POST` of a
      `WebhookPayload` signed with the endpoint secret:
      `ScormFlow-Signature: t=<unix seconds>,v1=<hex HMAC-SHA256 of "<t>.<raw body>">`.
      `ScormFlow-Event` names the event and `ScormFlow-Delivery` the delivery.
      Any 2xx acknowledges it; anything else (including redirects and timeouts)
      is retried with exponential backoff until `WEBHOOK_MAX_ATTEMPTS`, after
      which the delivery is `FAILED` and can be retried by hand. Deliveries are
      at-least-once — dedupe on the payload `id`.
  - name: Events
    description: |
      A live feed of the tenant's engine events over Server-Sent Events — the
      same `WebhookPayload` envelope a webhook receives, without having to
      expose a public endpoint. Built for dashboards and back-office tools;
      the stream needs an API key, so keep it server-side. Events are not
      replayed: a client that reconnects resumes from that moment, and
      webhooks remain the durable channel. Both channels share event ids, so
      a consumer of both can dedupe. With `EVENT_BUS_DRIVER=redis` every engine
      instance's stream sees every event, whichever instance raised it.
  - name: Certificates
    description: |
      PDF completion certificates. When `CERTIFICATES_ENABLED` (the default),
      an attempt gets exactly one certificate the first time it is completed
      and not failed, announced as `certificate.issued`. Learner name, course
      title and score are snapshotted at issue time; the PDF is rendered on
      demand. Each certificate carries a public serial (`XXXX-XXXX-XXXX`) that
      anyone can check at `GET /certificates/verify/{serial}`.
  - name: Auth
    description: Token issuance for player sessions.
  - name: System
    description: Health and metadata.
  - name: Embed
    description: |
      Static-asset routes for embedding SCORM courses without our SDK. Enables the
      "backend-only" use case: drop in an `<iframe>` or a `<script>` tag and any
      spec-compliant SCO works — regardless of the authoring tool or API wrapper
      it was built with.

security:
  - ApiKeyAuth: []

paths:
  # ─────────────────────────────────────────────────────────────────────────
  # System
  # ─────────────────────────────────────────────────────────────────────────
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Liveness probe
      description: |
        Also served at the server root as `GET /healthz` for load balancers and
        container health checks.
      security: []
      responses:
        '200':
          description: Engine is alive
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: { type: string, enum: [ok] }
                  version: { type: string }

  /ready:
    get:
      tags: [System]
      operationId: getReadiness
      summary: Readiness probe (DB + storage reachable)
      description: |
        Runs a trivial database query and the storage driver's own probe (a
        writable directory for `local`, `HeadBucket` for `s3`). Each check has a
        3 s budget. Failure details are logged, not returned. Also served at the
        server root as `GET /readyz`.
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessReport' }
        '503':
          description: Not ready — at least one dependency check failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessReport' }

  # ─────────────────────────────────────────────────────────────────────────
  # Embed (SDK-less integration)
  # ─────────────────────────────────────────────────────────────────────────
  /play/{attemptId}:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
    get:
      tags: [Embed]
      summary: Self-contained iframe player page
      description: |
        Returns an HTML page that loads the SCO, injects the SCORM runtime API
        (`window.API` / `window.API_1484_11`), and persists progress to this engine.
        Host with a single `<iframe>` — no SDK or framework required.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
          description: Attempt JWT (issued by `/auth/attempt-token`).
        - name: theme
          in: query
          schema: { type: string, enum: [light, dark, auto], default: auto }
        - name: source
          in: query
          description: |
            Where the SCO content comes from. `engine` (default) serves the
            uploaded package via `/courses/{id}/content/*` (and sets an auth
            cookie so sub-resources authenticate). `external` embeds the URL in
            `src` instead.
          schema: { type: string, enum: [engine, external], default: engine }
        - name: src
          in: query
          description: Absolute SCO entry URL. Required when `source=external`.
          schema: { type: string, format: uri }
        - name: scoId
          in: query
          schema: { type: string }
          description: Optional — override the default SCO (engine source only).
      responses:
        '200':
          description: HTML player page
          content:
            text/html:
              schema: { type: string }
        '400':
          description: Missing content source (e.g. source=external without src).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '403':
          description: Token is not valid for this attempt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /runtime.js:
    get:
      tags: [Embed]
      summary: Standalone SCORM runtime bridge script
      description: |
        Returns a small JS file that, when included via `<script>`, exposes
        `window.API` (SCORM 1.2) and `window.API_1484_11` (SCORM 2004) wired to
        this engine. A clean-room, spec-compliant implementation — no third-party
        SCORM libraries are bundled or required. The SCO inside an `<iframe>`
        finds the globals via the normal SCORM lookup walk (parent, then opener)
        and behaves exactly as it would against any conformant LMS.

        ```html
        <script src="https://your-engine/runtime.js?attemptId=...&token=..."></script>
        <iframe src="./course/index.html"></iframe>
        ```
      security: []
      parameters:
        - name: attemptId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: token
          in: query
          required: true
          schema: { type: string }
          description: Attempt JWT (issued by `/auth/attempt-token`).
      responses:
        '200':
          description: JavaScript runtime bridge
          content:
            application/javascript:
              schema: { type: string }
            text/javascript:
              schema: { type: string }

  # ─────────────────────────────────────────────────────────────────────────
  # Auth
  # ─────────────────────────────────────────────────────────────────────────
  /auth/attempt-token:
    post:
      tags: [Auth]
      summary: Issue a short-lived JWT scoped to a single attempt
      description: |
        Called by the LMS backend to mint a token the browser-side player can use
        without exposing the long-lived API key. Token TTL defaults to the attempt
        duration limit (configurable, max 24h).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attemptId]
              properties:
                attemptId: { type: string, format: uuid }
                ttlSeconds: { type: integer, minimum: 60, maximum: 86400, default: 3600 }
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expiresAt: { type: string, format: date-time }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────────────────────────────────────────────────────────
  # Courses
  # ─────────────────────────────────────────────────────────────────────────
  /courses:
    get:
      tags: [Courses]
      summary: List courses
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: q
          in: query
          schema: { type: string }
          description: Free-text search on course title.
      responses:
        '200':
          description: Paginated course list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseListResponse'

    post:
      tags: [Courses]
      summary: Upload a SCORM package
      description: |
        Accepts a SCORM 1.2 or 2004 ZIP package. The engine extracts the package,
        parses `imsmanifest.xml`, persists metadata, and stores the package files
        via the configured storage adapter.

        For large files prefer the two-step flow:
        1. `POST /courses/upload-url` to get a presigned upload URL.
        2. `POST /courses` with `{ uploadKey }` to register the uploaded package.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: SCORM package ZIP.
                title:
                  type: string
                  description: Override the title parsed from the manifest.
          application/json:
            schema:
              type: object
              required: [uploadKey]
              properties:
                uploadKey: { type: string, description: Storage key returned by /courses/upload-url }
                title: { type: string }
      responses:
        '201':
          description: Course created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400': { $ref: '#/components/responses/BadRequest' }
        '422':
          description: Invalid SCORM package (malformed ZIP or manifest)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /courses/upload-url:
    post:
      tags: [Courses]
      summary: Get a presigned URL for direct package upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, sizeBytes]
              properties:
                filename: { type: string }
                sizeBytes: { type: integer, minimum: 1 }
                contentType: { type: string, default: application/zip }
      responses:
        '200':
          description: Upload URL issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadUrl: { type: string, format: uri }
                  uploadKey: { type: string }
                  expiresAt: { type: string, format: date-time }
                  method: { type: string, enum: [PUT, POST] }
                  headers:
                    type: object
                    additionalProperties: { type: string }

  /courses/{courseId}:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [Courses]
      summary: Get a course
      responses:
        '200':
          description: Course
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Course' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Courses]
      summary: Delete a course and all its attempts
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /courses/{courseId}/launch-url:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [Courses]
      summary: Get a signed launch URL for the course's primary SCO
      description: |
        Returns a short-lived URL pointing at the SCO entry point on the engine's
        static asset host. The player loads this in an iframe.
      parameters:
        - name: scoId
          in: query
          schema: { type: string }
          description: Optional — defaults to the manifest's primary SCO.
      responses:
        '200':
          description: Launch URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  launchUrl: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }

  /courses/{courseId}/content/{path}:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - name: path
        in: path
        required: true
        description: File path within the extracted package (e.g. `index.html`, `assets/app.js`).
        schema: { type: string }
    get:
      tags: [Courses]
      summary: Stream an extracted package file (engine-hosted content)
      description: |
        Serves a file from an uploaded course's extracted package. Used by the
        engine-hosted player.

        Auth is dual: a tenant **API key** (server-side), or an **attempt token**
        scoped to an attempt on this course — supplied as a bearer token, `?token=`,
        or the `sf_attempt` cookie the `/play` page sets so the SCO's relative
        sub-resource requests authenticate automatically.
      security:
        - ApiKeyAuth: []
        - AttemptJWT: []
      responses:
        '200':
          description: The requested file.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400':
          description: Invalid path (e.g. traversal attempt).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }

  /courses/validate:
    post:
      tags: [Courses]
      summary: Validate a SCORM package without registering it
      description: Useful for CI / authoring pipelines. No course is persisted.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Validation report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationReport'

  # ─────────────────────────────────────────────────────────────────────────
  # Attempts
  # ─────────────────────────────────────────────────────────────────────────
  /courses/{courseId}/attempts:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    post:
      tags: [Attempts]
      summary: Start or resume an attempt
      description: |
        Starts a new attempt for a learner against the course, or resumes the
        learner's existing in-progress attempt for the same SCO. A fresh attempt
        launches `ab-initio`; a resumed one launches `resume` and returns its last
        committed CMI snapshot so the player can rehydrate the SCO.

        Pass `restart: true` to force a brand-new attempt even when a resumable
        one exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [learnerId]
              properties:
                learnerId:
                  type: string
                  description: |
                    Opaque identifier from the host LMS. The engine never stores PII —
                    this is the only learner identifier it knows.
                learnerName:
                  type: string
                  description: Optional display name passed to the SCO as `student_name`.
                scoId:
                  type: string
                  description: Target SCO; defaults to the course's primary SCO.
                mode:
                  type: string
                  enum: [normal, browse, review]
                  default: normal
                restart:
                  type: boolean
                  default: false
                  description: Force a new attempt instead of resuming an open one.
      responses:
        '201':
          description: New attempt created (ab-initio).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartAttemptResponse' }
        '200':
          description: Existing in-progress attempt resumed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartAttemptResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /attempts/{attemptId}:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
    get:
      tags: [Attempts]
      summary: Get an attempt
      description: Returns the attempt's rolled-up state plus its objective and interaction rows.
      responses:
        '200':
          description: Attempt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attempt' }
        '404': { $ref: '#/components/responses/NotFound' }

  /attempts/{attemptId}/runtime:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
    get:
      tags: [Runtime]
      summary: Get the runtime state for (re)hydrating a SCO
      description: |
        Returns the CMI snapshot, SCORM version, and entry mode a player needs to
        initialize the SCO. `entry` is `resume` once the attempt has any committed
        CMI, otherwise `ab-initio`. This is the read side of the runtime loop; use
        the start-attempt response for the initial launch and this endpoint to
        re-fetch state (e.g. after a reload) without creating a new attempt.

        Auth is dual: a tenant API key, or an attempt token scoped to this attempt.
      security:
        - ApiKeyAuth: []
        - AttemptJWT: []
      responses:
        '200':
          description: Runtime state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeState' }
        '403':
          description: Token is not valid for this attempt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────────────────────────────────────────────────────────
  # Runtime
  # ─────────────────────────────────────────────────────────────────────────
  # Design note: a SCORM SCO can issue dozens of SetValue calls per minute.
  # Rather than one round-trip per call, the in-browser player holds CMI state
  # in memory and flushes changes via a single batched /commit. Initialize is
  # implicit in the start-attempt response (which carries the resume snapshot),
  # and Terminate is folded into /commit via the `terminate` flag.
  /attempts/{attemptId}/commit:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
    post:
      tags: [Runtime]
      summary: Commit a batch of CMI value changes
      description: |
        Replays a batch of `SetValue` writes through an authoritative server-side
        runtime session seeded from the attempt's last snapshot, then persists the
        result. The player should call this:
        - On `LMSCommit` / `Commit` from the SCO.
        - On a debounced interval (e.g. every 10s) to reduce data-loss risk.
        - On `beforeunload` (with `keepalive: true`).

        Set `terminate: true` to close the session out (`LMSFinish` / `Terminate`),
        performing a final commit and finalizing the attempt.

        Keys use SCORM-version-native naming:
        - SCORM 1.2: `cmi.core.lesson_status`, `cmi.suspend_data`, ...
        - SCORM 2004: `cmi.completion_status`, `cmi.success_status`, ...

        **Validation policy** (server-configured via `SCORM_VALIDATION_MODE`):
        - `lenient` (default): mirrors certified commercial LMSes — writes that
          fail validation are still persisted and reported in `warnings`. SCORM
          content in the wild routinely violates the spec, and rejecting commits
          would break otherwise-functional courses. A single bad write never
          aborts the batch, so `ok` stays `true`.
        - `strict`: writes that fail validation are dropped and reported in
          `errors` (`ok` is `false`), for conformance-testing content. Valid
          writes in the same batch still persist.

        Either way the commit as a whole succeeds; inspect `errors`/`warnings` for
        per-element detail, not for retry control flow.

        Auth is dual: a tenant API key (server-side), or an attempt token scoped
        to this attempt (browser player).
      security:
        - ApiKeyAuth: []
        - AttemptJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitRequest'
      responses:
        '200':
          description: Commit accepted (possibly with warnings or per-element errors).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitResponse'
        '403':
          description: Token is not valid for this attempt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Attempt already finished.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /attempts/{attemptId}/sync:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
    post:
      tags: [Runtime]
      summary: Reconcile an offline commit queue
      operationId: syncAttemptCommits
      description: |
        Replays commits a player recorded while offline, in `seq` order, through
        the same validation and persistence as `POST /attempts/{id}/commit`.

        Reconciliation is idempotent: commits at or below the attempt's
        `lastCommitSeq` (or repeated within the batch) are reported as
        `duplicate` and skipped, so a client can resend its whole queue after a
        dropped response. Once the attempt is finished — by a terminate in this
        batch or earlier — every later commit is reported as `conflict`; server
        state wins. Per-commit outcomes are returned rather than failing the batch.

        Auth matches the commit endpoint (API key or attempt token).
      security:
        - ApiKeyAuth: []
        - AttemptJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncRequest' }
      responses:
        '200':
          description: Per-commit reconciliation outcomes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncResponse' }
        '400':
          description: Malformed queue (missing/negative `seq`, bad `recordedAt`, empty or oversized batch).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Token is not valid for this attempt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────────────────────────────────────────────────────────
  # Analytics
  # ─────────────────────────────────────────────────────────────────────────
  /analytics/overview:
    get:
      tags: [Analytics]
      summary: Tenant-wide analytics overview
      responses:
        '200':
          description: Overview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsOverview' }

  /analytics/courses/{courseId}:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [Analytics]
      summary: Analytics for a single course
      responses:
        '200':
          description: Course analytics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourseAnalytics' }

  /analytics/learners/{learnerId}:
    parameters:
      - name: learnerId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Analytics]
      summary: Analytics for a single learner
      responses:
        '200':
          description: Learner analytics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearnerAnalytics' }

  # ─────────────────────────────────────────────────────────────────────────
  # LRS — xAPI 1.0.3
  # ─────────────────────────────────────────────────────────────────────────
  /xapi/about:
    get:
      tags: [LRS]
      summary: xAPI versions this LRS implements
      description: Unauthenticated, and exempt from the version header — this is how a client discovers what we speak.
      security: []
      responses:
        '200':
          description: About document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/XapiAbout' }

  /xapi/statements:
    parameters:
      - $ref: '#/components/parameters/XapiVersion'
    post:
      tags: [LRS]
      summary: Store one statement or a batch
      description: |
        Statements are immutable. Re-sending a byte-identical statement under an
        id already stored is a no-op (safe retry); sending a *different* statement
        under that id is a `409`.

        To include attachment bodies, send `multipart/mixed` with the statement
        JSON as the first part. Every declared attachment without a `fileUrl`
        must have its body in the request, and every body must be declared;
        otherwise the request is a `400` (`missing_attachment`,
        `unexpected_attachment`, `attachment_hash_mismatch`, `invalid_signature`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/XapiStatement'
                - type: array
                  items: { $ref: '#/components/schemas/XapiStatement' }
          multipart/mixed:
            schema:
              type: string
              format: binary
              description: Statement JSON part followed by attachment parts.
      responses:
        '200':
          description: Ids of the stored statements, in request order.
          content:
            application/json:
              schema:
                type: array
                items: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: Sent with a cmi5 session token, and a statement breaks a cmi5 statement rule (`cmi5_rule_violation`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: A different statement is already stored under one of these ids.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      tags: [LRS]
      summary: Store a single statement under a known id
      parameters:
        - name: statementId
          in: query
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/XapiStatement' }
          multipart/mixed:
            schema:
              type: string
              format: binary
              description: Statement JSON part followed by attachment parts.
      responses:
        '204': { description: Stored. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: A different statement is already stored under this id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [LRS]
      summary: Query statements
      description: |
        With `statementId` or `voidedStatementId` the response is a single
        statement; otherwise it is a StatementResult envelope. The two id
        parameters cannot be combined with any filter.

        Voided statements are excluded from filtered results and are reachable
        only through `voidedStatementId`.
      parameters:
        - name: statementId
          in: query
          schema: { type: string, format: uuid }
        - name: voidedStatementId
          in: query
          schema: { type: string, format: uuid }
        - name: agent
          in: query
          description: JSON-encoded Agent or Group.
          schema: { type: string }
        - name: verb
          in: query
          schema: { type: string, format: iri }
        - name: activity
          in: query
          schema: { type: string, format: iri }
        - name: registration
          in: query
          schema: { type: string, format: uuid }
        - name: related_activities
          in: query
          description: Also match the activity in context activities, not just as the object.
          schema: { type: boolean, default: false }
        - name: related_agents
          in: query
          description: Also match the agent as instructor, team, object or authority.
          schema: { type: boolean, default: false }
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          description: 0 means "as many as the LRS allows" (100).
          schema: { type: integer, minimum: 0, default: 0 }
        - name: ascending
          in: query
          schema: { type: boolean, default: false }
        - name: format
          in: query
          schema:
            type: string
            enum: [ids, exact, canonical]
            default: exact
        - name: cursor
          in: query
          description: Opaque paging token; supplied by the `more` link, never constructed by hand.
          schema: { type: string }
        - name: attachments
          in: query
          description: |
            Respond with `multipart/mixed`: the usual JSON first, then the stored
            body of every attachment the returned statements reference.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: A StatementResult, or a single statement when queried by id.
          headers:
            X-Experience-API-Consistent-Through:
              schema: { type: string, format: date-time }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/XapiStatementResult'
                  - $ref: '#/components/schemas/XapiStatement'
            multipart/mixed:
              schema:
                type: string
                format: binary
                description: Sent when `attachments=true`.
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /xapi/activities/state:
    parameters:
      - $ref: '#/components/parameters/XapiVersion'
      - name: activityId
        in: query
        required: true
        schema: { type: string, format: iri }
      - name: agent
        in: query
        required: true
        description: JSON-encoded Agent or Group.
        schema: { type: string }
      - name: registration
        in: query
        schema: { type: string, format: uuid }
      - name: stateId
        in: query
        description: Omit on GET to list ids, or on DELETE to clear every document.
        schema: { type: string }
    get:
      tags: [LRS]
      summary: Fetch a state document, or list the ids of all of them
      parameters:
        - name: since
          in: query
          description: When listing, only ids updated after this instant.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: The document (its own content type), or a JSON array of state ids.
          headers:
            ETag: { schema: { type: string } }
            Last-Modified: { schema: { type: string } }
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { type: string }
                  - type: object
                    additionalProperties: true
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [LRS]
      summary: Replace a state document
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '204':
          description: Stored.
          headers:
            ETag: { schema: { type: string } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Document exists and `XAPI_REQUIRE_PRECONDITIONS` is on, but no If-Match/If-None-Match was sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412':
          description: If-Match or If-None-Match precondition failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [LRS]
      summary: Merge into a state document
      description: Both the stored and the posted document must be JSON objects; anything else is a 400 rather than a silent overwrite.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '204':
          description: Merged.
          headers:
            ETag: { schema: { type: string } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '412':
          description: Precondition failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [LRS]
      summary: Delete one state document, or every document for an activity + agent
      responses:
        '204': { description: Deleted. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '412':
          description: Precondition failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /xapi/activities/profile:
    parameters:
      - $ref: '#/components/parameters/XapiVersion'
      - name: activityId
        in: query
        required: true
        schema: { type: string, format: iri }
      - name: profileId
        in: query
        description: Omit on GET to list the ids of every profile for this activity.
        schema: { type: string }
    get:
      tags: [LRS]
      summary: Fetch an activity profile document, or list the ids of all of them
      parameters:
        - $ref: '#/components/parameters/XapiDocumentSince'
      responses:
        '200': { $ref: '#/components/responses/XapiDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [LRS]
      summary: Replace an activity profile document
      requestBody: { $ref: '#/components/requestBodies/XapiDocument' }
      responses:
        '204': { $ref: '#/components/responses/XapiDocumentStored' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/XapiPreconditionRequired' }
        '412': { $ref: '#/components/responses/XapiPreconditionFailed' }
    post:
      tags: [LRS]
      summary: Merge into an activity profile document
      description: Both the stored and the posted document must be JSON objects; anything else is a 400 rather than a silent overwrite.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '204': { $ref: '#/components/responses/XapiDocumentStored' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/XapiPreconditionRequired' }
        '412': { $ref: '#/components/responses/XapiPreconditionFailed' }
    delete:
      tags: [LRS]
      summary: Delete an activity profile document
      responses:
        '204': { description: Deleted. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '412': { $ref: '#/components/responses/XapiPreconditionFailed' }

  /xapi/agents/profile:
    parameters:
      - $ref: '#/components/parameters/XapiVersion'
      - name: agent
        in: query
        required: true
        description: JSON-encoded Agent or Group.
        schema: { type: string }
      - name: profileId
        in: query
        description: Omit on GET to list the ids of every profile for this agent.
        schema: { type: string }
    get:
      tags: [LRS]
      summary: Fetch an agent profile document, or list the ids of all of them
      parameters:
        - $ref: '#/components/parameters/XapiDocumentSince'
      responses:
        '200': { $ref: '#/components/responses/XapiDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [LRS]
      summary: Replace an agent profile document
      requestBody: { $ref: '#/components/requestBodies/XapiDocument' }
      responses:
        '204': { $ref: '#/components/responses/XapiDocumentStored' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/XapiPreconditionRequired' }
        '412': { $ref: '#/components/responses/XapiPreconditionFailed' }
    post:
      tags: [LRS]
      summary: Merge into an agent profile document
      description: Both the stored and the posted document must be JSON objects; anything else is a 400 rather than a silent overwrite.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '204': { $ref: '#/components/responses/XapiDocumentStored' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/XapiPreconditionRequired' }
        '412': { $ref: '#/components/responses/XapiPreconditionFailed' }
    delete:
      tags: [LRS]
      summary: Delete an agent profile document
      responses:
        '204': { description: Deleted. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '412': { $ref: '#/components/responses/XapiPreconditionFailed' }

  /xapi/activities:
    parameters:
      - $ref: '#/components/parameters/XapiVersion'
      - name: activityId
        in: query
        required: true
        schema: { type: string, format: iri }
    get:
      tags: [LRS]
      summary: The canonical Activity for an IRI
      description: |
        Derived from the statements this LRS has accepted — we keep no separate
        activity registry. The returned definition is the merge of every
        definition clients have sent for that IRI, newest winning.
      responses:
        '200':
          description: The activity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/XapiActivity' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: No stored statement references this activity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /xapi/agents:
    parameters:
      - $ref: '#/components/parameters/XapiVersion'
      - name: agent
        in: query
        required: true
        description: JSON-encoded Agent or Group.
        schema: { type: string }
    get:
      tags: [LRS]
      summary: The Person this LRS knows for an agent
      description: |
        A Person is an Agent whose identifying properties are arrays — everything
        the LRS has seen for one inverse-functional identifier. An agent with no
        statements on file still returns a Person carrying the IFI you asked for.
      responses:
        '200':
          description: The person.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/XapiPerson' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ─────────────────────────────────────────────────────────────────────────
  # cmi5
  # ─────────────────────────────────────────────────────────────────────────
  /cmi5/courses:
    get:
      tags: [cmi5]
      summary: List cmi5 courses
      responses:
        '200':
          description: Course list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cmi5CourseListResponse' }
    post:
      tags: [cmi5]
      summary: Import a cmi5 course
      description: |
        Accepts a ZIP with `cmi5.xml` at its root (the engine hosts the files), or
        a bare `cmi5.xml` whose AU urls are all absolute (content hosted elsewhere).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                title: { type: string, description: Override the course title. }
      responses:
        '201':
          description: Course imported
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cmi5Course' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422':
          description: Invalid package or course structure
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /cmi5/courses/validate:
    post:
      tags: [cmi5]
      summary: Validate a cmi5 package without importing it
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Validation report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cmi5ValidationReport' }

  /cmi5/courses/{cmi5CourseId}:
    parameters:
      - name: cmi5CourseId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [cmi5]
      summary: Get a cmi5 course
      responses:
        '200':
          description: Course
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cmi5Course' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [cmi5]
      summary: Delete a cmi5 course, its registrations and hosted files
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /cmi5/registrations:
    post:
      tags: [cmi5]
      summary: Register a learner for a cmi5 course
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Cmi5RegistrationRequest' }
      responses:
        '201':
          description: Registration created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cmi5Registration' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /cmi5/learner-preferences:
    get:
      tags: [cmi5]
      summary: Read a learner's cmi5LearnerPreferences
      parameters:
        - name: agent
          in: query
          description: JSON-encoded xAPI Agent. Either this or `learnerId`.
          schema: { type: string }
        - name: learnerId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Stored preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cmi5LearnerPreferences' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [cmi5]
      summary: Set a learner's cmi5LearnerPreferences
      description: |
        Replaces the learner's `cmi5LearnerPreferences` Agent Profile document.
        It belongs to the learner, not a registration, so it applies to every
        course they launch.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Cmi5LearnerPreferencesRequest' }
      responses:
        '200':
          description: Stored preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cmi5LearnerPreferences' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /cmi5/registrations/{registrationId}:
    parameters:
      - name: registrationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [cmi5]
      summary: Registration progress, per AU
      responses:
        '200':
          description: Registration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cmi5Registration' }
        '404': { $ref: '#/components/responses/NotFound' }

  /cmi5/registrations/{registrationId}/launch:
    parameters:
      - name: registrationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [cmi5]
      summary: Launch an AU
      description: |
        Abandons any session the learner left open on this AU, opens a new
        session, writes the `LMS.LaunchData` state document, records `launched`,
        and returns the launch URL.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Cmi5LaunchRequest' }
      responses:
        '200':
          description: Launch URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cmi5LaunchResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /cmi5/registrations/{registrationId}/waive:
    parameters:
      - name: registrationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [cmi5]
      summary: Waive an AU's moveOn requirement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Cmi5WaiveRequest' }
      responses:
        '200':
          description: Updated registration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cmi5Registration' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The AU is already satisfied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /cmi5/fetch:
    post:
      tags: [cmi5]
      summary: Redeem a fetch URL for an LRS auth token (AU-facing)
      description: |
        The `fetch` launch parameter points here. Each fetch URL works exactly
        once; it carries its own one-time key, so no other credentials are needed.
      security: []
      parameters:
        - { name: session, in: query, required: true, schema: { type: string } }
        - { name: key, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Auth token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cmi5FetchResponse' }
        '401':
          description: Fetch URL already redeemed, invalid, or expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cmi5FetchError' }

  /cmi5/content/{token}/{path}:
    parameters:
      - name: token
        in: path
        required: true
        description: Content token minted into the launch URL.
        schema: { type: string }
      - name: path
        in: path
        required: true
        description: File path inside the package.
        schema: { type: string }
    get:
      tags: [cmi5]
      summary: Stream a file from an engine-hosted cmi5 package (AU-facing)
      security: []
      responses:
        '200':
          description: File contents
          content:
            '*/*':
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────────────────────────────────────────────────
  # Webhooks
  # ───────────────────────────────────────────────────────────────────────
  /webhooks:
    get:
      tags: [Webhooks]
      summary: List webhook endpoints
      responses:
        '200':
          description: Endpoints, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/WebhookEndpoint' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [Webhooks]
      summary: Register a webhook endpoint
      description: The response is the only time the signing `secret` is shown, apart from rotation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEndpointCreate' }
      responses:
        '201':
          description: Endpoint created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEndpointWithSecret' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /webhooks/event-types:
    get:
      tags: [Webhooks]
      summary: List the event types an endpoint can subscribe to
      responses:
        '200':
          description: Event types
          content:
            application/json:
              schema:
                type: object
                required: [data, wildcard]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/WebhookEventType' }
                  wildcard:
                    type: string
                    description: Subscribes to every event, including ones added later.
                    example: '*'

  /events/stream:
    get:
      tags: [Events]
      summary: Stream engine events live (Server-Sent Events)
      description: |
        Holds the connection open and writes one SSE message per event:
        `id` is the event id, `event` its type and `data` the JSON
        `WebhookPayload`. Comment lines (`: ping`) keep idle connections
        alive every `EVENT_STREAM_HEARTBEAT_SECONDS`. A client that stops
        reading is disconnected once about 1 MB is buffered for it.
      parameters:
        - name: types
          in: query
          required: false
          description: Comma-separated event types to receive; every type when omitted (or `*`).
          schema: { type: string }
          example: course.completed,certificate.issued
      responses:
        '200':
          description: An open `text/event-stream`.
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE messages, for example:

                      id: evt_3f1c…
                      event: course.completed
                      data: {"id":"evt_3f1c…","type":"course.completed","createdAt":"…","data":{…}}
              example: |
                id: evt_0b7e0d4e-8a7c-4c43-9a8e-2a0f0a6f4c11
                event: course.completed
                data: {"id":"evt_0b7e0d4e-8a7c-4c43-9a8e-2a0f0a6f4c11","type":"course.completed","createdAt":"2026-10-13T09:00:00.000Z","data":{"attemptId":"att_1"}}
        '400':
          description: `types` names an unknown event type (`code: invalid_events`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /webhooks/{webhookId}:
    parameters:
      - name: webhookId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Webhooks]
      summary: Get a webhook endpoint
      responses:
        '200':
          description: Endpoint
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEndpoint' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Webhooks]
      summary: Update a webhook endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEndpointUpdate' }
      responses:
        '200':
          description: Updated endpoint
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEndpoint' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Webhooks]
      summary: Delete a webhook endpoint and its delivery log
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /webhooks/{webhookId}/rotate-secret:
    parameters:
      - name: webhookId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Webhooks]
      summary: Replace the signing secret
      description: The old secret stops working immediately.
      responses:
        '200':
          description: Endpoint with its new secret
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEndpointWithSecret' }
        '404': { $ref: '#/components/responses/NotFound' }

  /webhooks/{webhookId}/test:
    parameters:
      - name: webhookId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Webhooks]
      summary: Send a test event
      description: |
        Sends a `webhook.test` event to this endpoint only — even when it is
        disabled or not subscribed — and answers once the first attempt is done.
      responses:
        '200':
          description: The delivery, after its first attempt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookDelivery' }
        '404': { $ref: '#/components/responses/NotFound' }

  /webhooks/{webhookId}/deliveries:
    parameters:
      - name: webhookId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Webhooks]
      summary: The endpoint's delivery log, newest first
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/WebhookDeliveryStatus' }
        - name: eventType
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: before
          in: query
          description: The previous page's `nextCursor`.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Deliveries
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/WebhookDelivery' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /webhooks/deliveries/{deliveryId}:
    parameters:
      - name: deliveryId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Webhooks]
      summary: Get one delivery
      responses:
        '200':
          description: Delivery
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookDelivery' }
        '404': { $ref: '#/components/responses/NotFound' }

  /webhooks/deliveries/{deliveryId}/retry:
    parameters:
      - name: deliveryId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Webhooks]
      summary: Re-send a delivery now
      description: |
        Works in any state, including `FAILED` (the dead-letter state) and
        `SUCCEEDED`. A manual retry gets one attempt; if it fails the delivery
        goes back to `FAILED`.
      responses:
        '200':
          description: The delivery, after the attempt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookDelivery' }
        '404': { $ref: '#/components/responses/NotFound' }

  /certificates:
    get:
      tags: [Certificates]
      summary: List certificates, newest first
      parameters:
        - name: learnerId
          in: query
          description: The learner's id in your system.
          schema: { type: string }
        - name: courseId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [valid, revoked] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: before
          in: query
          description: The previous page's `nextCursor`.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Certificates
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Certificate' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /certificates/verify/{serial}:
    parameters:
      - name: serial
        in: path
        required: true
        description: The code printed on the certificate. Case, spaces and dashes are ignored.
        schema: { type: string }
    get:
      tags: [Certificates]
      summary: Check a certificate by its printed code
      description: Public — no credentials. Reveals only what is printed on the certificate.
      security: []
      responses:
        '200':
          description: The certificate exists; `valid` is false once it is revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CertificateVerification' }
        '404': { $ref: '#/components/responses/NotFound' }

  /certificates/{certificateId}:
    parameters:
      - name: certificateId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Certificates]
      summary: Get one certificate
      responses:
        '200':
          description: Certificate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Certificate' }
        '404': { $ref: '#/components/responses/NotFound' }

  /certificates/{certificateId}/pdf:
    parameters:
      - name: certificateId
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/CertificateDownload'
    get:
      tags: [Certificates]
      summary: Download the certificate PDF
      responses:
        '200': { $ref: '#/components/responses/CertificatePdf' }
        '404': { $ref: '#/components/responses/NotFound' }

  /certificates/{certificateId}/revoke:
    parameters:
      - name: certificateId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Certificates]
      summary: Revoke a certificate
      description: |
        Verification then reports it invalid and the PDF is stamped REVOKED.
        Revoking an already-revoked certificate keeps the original revocation.
        Emits `certificate.revoked`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: The revoked certificate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Certificate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /attempts/{attemptId}/certificate:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
    get:
      tags: [Certificates]
      summary: The attempt's certificate
      description: Readable with the attempt's player token, so a learner-facing page can show it.
      security:
        - ApiKeyAuth: []
        - AttemptJWT: []
      responses:
        '200':
          description: Certificate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Certificate' }
        '404':
          description: The attempt has no certificate (yet) — `certificate_not_found`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [Certificates]
      summary: Issue the attempt's certificate now
      description: |
        For attempts that completed before certificates were enabled, or whose
        automatic issue failed. Idempotent: an attempt that already has a
        certificate returns it with `200`.
      responses:
        '200':
          description: The attempt already had this certificate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Certificate' }
        '201':
          description: Issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Certificate' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The attempt is not completed, or failed — `attempt_not_eligible`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /attempts/{attemptId}/certificate/pdf:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
      - $ref: '#/components/parameters/CertificateDownload'
      - name: token
        in: query
        description: The attempt token, for plain `<a href>` links that can't send a header.
        schema: { type: string }
    get:
      tags: [Certificates]
      summary: Download the attempt's certificate PDF
      security:
        - ApiKeyAuth: []
        - AttemptJWT: []
      responses:
        '200': { $ref: '#/components/responses/CertificatePdf' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  # ───────────────────────────────────────────────────────────────────────
  # Security
  # ───────────────────────────────────────────────────────────────────────
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Long-lived tenant API key. Used for server-to-server calls.
    AttemptJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Short-lived JWT scoped to a single attempt. Issued via /auth/attempt-token.
        Used by the in-browser player.
    Cmi5Session:
      type: http
      scheme: basic
      description: |
        cmi5 session token from `POST /cmi5/fetch`, sent verbatim as
        `Authorization: Basic <auth-token>`. Accepted by the LRS resources.

  # ───────────────────────────────────────────────────────────────────────
  # Reusable parameters
  # ───────────────────────────────────────────────────────────────────────
  parameters:
    CourseId:
      name: courseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    CertificateDownload:
      name: download
      in: query
      description: '`1` to download (`Content-Disposition: attachment`) instead of viewing inline.'
      schema: { type: string, enum: ['1', 'true'] }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: Opaque pagination cursor returned by the previous page.
    XapiVersion:
      name: X-Experience-API-Version
      in: header
      required: true
      description: Must be `1.0` or `1.0.x`. Required on every LRS resource except About.
      schema: { type: string, default: '1.0.3' }
    XapiDocumentSince:
      name: since
      in: query
      description: When listing document ids, only those updated after this instant.
      schema: { type: string, format: date-time }

  # ───────────────────────────────────────────────────────────────────────
  # Reusable request bodies
  # ───────────────────────────────────────────────────────────────────────
  requestBodies:
    XapiDocument:
      required: true
      description: An opaque document body — JSON, text or binary.
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
        application/octet-stream:
          schema: { type: string, format: binary }

  # ───────────────────────────────────────────────────────────────────────
  # Reusable responses
  # ───────────────────────────────────────────────────────────────────────
  headers:
    RateLimitLimit:
      description: Requests the tenant may make per window. Present only when rate limiting is on.
      schema: { type: integer }
    RateLimitRemaining:
      description: Requests left in the current window.
      schema: { type: integer }
    RateLimitReset:
      description: Seconds until the current window ends and the budget refills.
      schema: { type: integer }

  responses:
    TooManyRequests:
      description: The tenant has exhausted its request budget for the current window; the request was not processed.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer }
        X-RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
        X-RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
        X-RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Request was malformed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    CertificatePdf:
      description: A one-page landscape A4 PDF. Revoked certificates are stamped REVOKED.
      headers:
        Content-Disposition:
          description: '`inline` (or `attachment` with `download=1`); filename `certificate-<serial>.pdf`.'
          schema: { type: string }
      content:
        application/pdf:
          schema: { type: string, format: binary }
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    XapiDocument:
      description: The document (in its own content type), or a JSON array of document ids.
      headers:
        ETag: { schema: { type: string } }
        Last-Modified: { schema: { type: string } }
      content:
        application/json:
          schema:
            oneOf:
              - type: array
                items: { type: string }
              - type: object
                additionalProperties: true
        application/octet-stream:
          schema: { type: string, format: binary }
    XapiDocumentStored:
      description: Stored.
      headers:
        ETag: { schema: { type: string } }
    XapiPreconditionRequired:
      description: Document exists and `XAPI_REQUIRE_PRECONDITIONS` is on, but no If-Match/If-None-Match was sent.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    XapiPreconditionFailed:
      description: If-Match or If-None-Match precondition failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  # ───────────────────────────────────────────────────────────────────────
  # Schemas
  # ───────────────────────────────────────────────────────────────────────
  schemas:
    # ── Core ─────────────────────────────────────────────────────────────
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable error code (e.g. `course_not_found`).
        message: { type: string }
        details:
          type: object
          additionalProperties: true
        requestId: { type: string }

    ReadinessReport:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        checks:
          type: object
          required: [database, storage]
          properties:
            database: { type: string, enum: [ok, error] }
            storage: { type: string, enum: [ok, error] }

    Pagination:
      type: object
      properties:
        nextCursor:
          type: string
          nullable: true
        hasMore: { type: boolean }

    ScormVersion:
      type: string
      enum: [SCORM_1_2, SCORM_2004_2, SCORM_2004_3, SCORM_2004_4]

    # ── Course ───────────────────────────────────────────────────────────
    Course:
      type: object
      required: [id, title, version, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string, nullable: true }
        version: { $ref: '#/components/schemas/ScormVersion' }
        status:
          type: string
          enum: [processing, ready, failed]
        scos:
          type: array
          items: { $ref: '#/components/schemas/Sco' }
        primaryScoId:
          type: string
          description: Default SCO launched when the player starts.
        masteryScore:
          type: number
          nullable: true
          description: 0-100 mastery threshold parsed from the manifest.
        manifest:
          $ref: '#/components/schemas/ManifestMetadata'
        sizeBytes: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Sco:
      type: object
      required: [id, identifier, title, launchHref]
      properties:
        id: { type: string }
        identifier:
          type: string
          description: Manifest `identifier` attribute.
        title: { type: string }
        launchHref:
          type: string
          description: Relative path within the package to the SCO entry point.
        parameters: { type: string, nullable: true }
        masteryScore: { type: number, nullable: true }

    ManifestMetadata:
      type: object
      properties:
        identifier: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        keywords:
          type: array
          items: { type: string }
        schemaVersion: { type: string }
        defaultOrganization: { type: string, nullable: true }

    CourseListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Course' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    ValidationReport:
      type: object
      properties:
        valid: { type: boolean }
        version:
          allOf:
            - $ref: '#/components/schemas/ScormVersion'
          nullable: true
        errors:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              message: { type: string }
              path: { type: string, nullable: true }
        warnings:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              message: { type: string }

    # ── Attempt ──────────────────────────────────────────────────────────
    Attempt:
      type: object
      required: [id, courseId, learnerId, status, attemptNumber, startedAt]
      properties:
        id: { type: string, format: uuid }
        courseId: { type: string, format: uuid }
        learnerId: { type: string }
        learnerName: { type: string, nullable: true }
        attemptNumber:
          type: integer
          description: 1-indexed sequence of attempts by this learner on this course.
        status:
          type: string
          enum: [not_started, in_progress, completed, passed, failed, terminated]
        completionStatus:
          type: string
          enum: [unknown, completed, incomplete, not_attempted]
          description: SCORM 2004 completion status; mapped from `cmi.completion_status`.
        successStatus:
          type: string
          enum: [unknown, passed, failed]
          description: SCORM 2004 success status; mapped from `cmi.success_status`.
        score:
          $ref: '#/components/schemas/Score'
        progressMeasure:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
        totalTimeSeconds:
          type: integer
          description: Total accumulated session time across all sessions in this attempt.
        location:
          type: string
          nullable: true
          description: Bookmark (`cmi.core.lesson_location` / `cmi.location`).
        startedAt: { type: string, format: date-time }
        lastAccessedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }

    Score:
      type: object
      properties:
        raw: { type: number, nullable: true }
        min: { type: number, nullable: true }
        max: { type: number, nullable: true }
        scaled:
          type: number
          nullable: true
          minimum: -1
          maximum: 1
          description: SCORM 2004 normalized score (-1..1).

    # ── Runtime ──────────────────────────────────────────────────────────
    RuntimeState:
      type: object
      required: [attemptId, version, status, cmi, entry, learner]
      properties:
        attemptId: { type: string, format: uuid }
        version: { $ref: '#/components/schemas/ScormVersion' }
        status:
          type: string
          enum: [IN_PROGRESS, COMPLETED, TERMINATED, EXPIRED]
        cmi:
          type: object
          additionalProperties: true
          description: |
            Full CMI data model snapshot, keyed by SCORM-native paths. Empty object
            for a new attempt; for a resume, contains every previously-committed key.
          example:
            cmi.core.lesson_status: incomplete
            cmi.core.lesson_location: page_4
            cmi.suspend_data: '{"chapter":2,"answers":[1,3,2]}'
            cmi.core.score.raw: 42
        entry:
          type: string
          enum: [ab-initio, resume]
          description: SCORM `cmi.core.entry` / `cmi.entry`.
        learner:
          type: object
          required: [id]
          properties:
            id: { type: string }
            name: { type: string, nullable: true }
        lastCommitSeq:
          type: integer
          nullable: true
          description: |
            Highest client commit `seq` applied so far (null if no commit carried
            one). Offline clients drop queued commits at or below it.

    StartAttemptResponse:
      type: object
      required: [attemptId, resumed, version, cmi]
      properties:
        attemptId: { type: string, format: uuid }
        resumed:
          type: boolean
          description: True when an existing in-progress attempt was resumed.
        version: { $ref: '#/components/schemas/ScormVersion' }
        entry:
          type: string
          enum: [ab-initio, resume, '']
          description: SCORM `cmi.core.entry` / `cmi.entry` the SCO should launch with.
        launch:
          type: object
          description: Read-only launch context the player injects before Initialize.
          properties:
            learnerId: { type: string }
            learnerName: { type: string }
            mode: { type: string, enum: [normal, browse, review] }
            totalTime:
              type: string
              description: Accumulated time from prior attempts, in the edition's timespan format.
            masteryScore: { type: number, nullable: true }
        cmi:
          type: object
          additionalProperties: true
          description: |
            Previously-committed CMI snapshot to rehydrate the SCO on resume. Empty
            object for a new (ab-initio) attempt.
          example:
            cmi.location: page_4
            cmi.suspend_data: '{"chapter":2}'

    CommitRequest:
      type: object
      required: [values]
      properties:
        values:
          oneOf:
            - type: object
              additionalProperties: { type: string }
            - type: array
              items:
                type: array
                minItems: 2
                maxItems: 2
                items: { type: string }
          description: |
            CMI writes to replay, as an object of key → value pairs or an ordered
            array of `[key, value]` pairs (use the array form when write order
            matters). Keys must match the SCORM version of the course.
          example:
            cmi.completion_status: completed
            cmi.score.scaled: '0.87'
            cmi.session_time: PT12M30S
        terminate:
          type: boolean
          default: false
          description: |
            When true, Terminate the session (final commit) and finalize the
            attempt instead of leaving it open for further commits. If the
            content set `cmi.exit` (`cmi.core.exit` in 1.2) to `suspend`,
            only the session ends: the attempt stays `IN_PROGRESS`, its session
            time is banked as `total_time`, and the next start resumes it.
        seq:
          type: integer
          minimum: 0
          description: |
            Optional client commit sequence number (strictly increasing per
            attempt). A commit whose `seq` is at or below the attempt's
            `lastCommitSeq` is acknowledged with `duplicate: true` and not
            re-applied, making retries after a dropped response safe.
        recordedAt:
          type: string
          format: date-time
          description: When the client recorded the commit, if it was queued offline.

    CommitResponse:
      type: object
      required: [ok, terminated, suspended, errors, warnings, summary]
      properties:
        ok:
          type: boolean
          description: False only in strict mode when one or more writes were rejected.
        terminated:
          type: boolean
          description: True when this commit finalized the attempt.
        suspended:
          type: boolean
          description: |
            True when a terminate with exit=suspend ended the session but left
            the attempt open to resume.
        duplicate:
          type: boolean
          description: |
            True when the request's `seq` was at or below the attempt's
            `lastCommitSeq`: the commit had already been applied and nothing
            was written. `summary` reflects the current state.
        errors:
          type: array
          description: |
            Writes rejected in strict mode (not persisted). Empty in lenient mode.
          items: { $ref: '#/components/schemas/CommitIssue' }
        warnings:
          type: array
          description: |
            Nonconformant writes accepted in lenient mode (persisted verbatim).
            Empty in strict mode. Use for observability, not retry logic.
          items: { $ref: '#/components/schemas/CommitIssue' }
        summary: { $ref: '#/components/schemas/RuntimeSummary' }

    QueuedCommit:
      type: object
      required: [seq, values]
      properties:
        seq:
          type: integer
          minimum: 0
          description: Client-assigned, strictly increasing per attempt.
        values: { $ref: '#/components/schemas/CommitRequest/properties/values' }
        terminate: { type: boolean, default: false }
        recordedAt:
          type: string
          format: date-time
          description: When the client originally recorded the commit.

    SyncRequest:
      type: object
      required: [commits]
      properties:
        commits:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/QueuedCommit' }

    SyncCommitOutcome:
      type: object
      required: [seq, status, errors, warnings, terminated, suspended]
      properties:
        seq: { type: integer }
        status:
          type: string
          enum: [applied, duplicate, conflict]
          description: |
            `applied`: persisted now. `duplicate`: already applied by an earlier
            sync (safe to drop). `conflict`: the attempt was already finished,
            so the commit can never apply (server state wins).
        terminated: { type: boolean }
        suspended: { type: boolean }
        errors:
          type: array
          items: { $ref: '#/components/schemas/CommitIssue' }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/CommitIssue' }

    SyncResponse:
      type: object
      required: [lastCommitSeq, results, summary]
      properties:
        lastCommitSeq:
          type: integer
          nullable: true
          description: The attempt's highest applied `seq` after reconciliation.
        results:
          type: array
          description: One outcome per submitted commit, in `seq` order.
          items: { $ref: '#/components/schemas/SyncCommitOutcome' }
        summary:
          description: Rollup after the last applied or duplicate commit; null if every commit conflicted.
          oneOf:
            - $ref: '#/components/schemas/RuntimeSummary'
            - type: 'null'

    CommitIssue:
      type: object
      required: [element, code, message]
      properties:
        element:
          type: string
          description: The CMI element the write targeted.
        code:
          type: integer
          description: SCORM API error code (edition-specific numeric code).
        message: { type: string }

    RuntimeSummary:
      type: object
      description: Edition-neutral rollup of the outcome-bearing CMI elements.
      properties:
        completionStatus:
          type: string
          enum: [completed, incomplete, 'not attempted', unknown]
        successStatus:
          type: string
          enum: [passed, failed, unknown]
        scoreRaw: { type: number, nullable: true }
        scoreMin: { type: number, nullable: true }
        scoreMax: { type: number, nullable: true }
        scoreScaled: { type: number, nullable: true }
        progressMeasure: { type: number, nullable: true }
        lessonLocation: { type: string, nullable: true }
        suspendData: { type: string, nullable: true }
        sessionTime: { type: string, nullable: true }
        exit: { type: string, nullable: true }

    # ── Analytics ────────────────────────────────────────────────────────
    AnalyticsOverview:
      type: object
      properties:
        courseCount: { type: integer }
        learnerCount: { type: integer }
        attemptCount: { type: integer }
        completionRate:
          type: number
          minimum: 0
          maximum: 1
        averageScore:
          type: number
          nullable: true

    CourseAnalytics:
      type: object
      properties:
        courseId: { type: string, format: uuid }
        attemptCount: { type: integer }
        completionCount: { type: integer }
        completionRate: { type: number, minimum: 0, maximum: 1 }
        averageScore: { type: number, nullable: true }
        averageTimeSeconds: { type: integer, nullable: true }
        passRate: { type: number, nullable: true, minimum: 0, maximum: 1 }
        recentAttempts:
          type: array
          items: { $ref: '#/components/schemas/Attempt' }

    LearnerAnalytics:
      type: object
      properties:
        learnerId: { type: string }
        attemptCount: { type: integer }
        completedCourseCount: { type: integer }
        totalTimeSeconds: { type: integer }
        recentAttempts:
          type: array
          items: { $ref: '#/components/schemas/Attempt' }

    # ── LRS / xAPI 1.0.3 ─────────────────────────────────────────────────
    XapiAbout:
      type: object
      required: [version]
      properties:
        version:
          type: array
          items: { type: string }
        extensions:
          type: object
          additionalProperties: true

    XapiLanguageMap:
      type: object
      description: RFC 5646 language tag → text.
      additionalProperties: { type: string }

    XapiAccount:
      type: object
      required: [homePage, name]
      properties:
        homePage: { type: string, format: iri }
        name: { type: string }

    XapiAgent:
      type: object
      description: |
        An Agent carries exactly one inverse-functional identifier (`mbox`,
        `mbox_sha1sum`, `openid` or `account`). A Group may carry none, in which
        case it must list members and is identified by that member set.
      properties:
        objectType:
          type: string
          enum: [Agent, Group]
        name: { type: string }
        mbox: { type: string, format: mailto }
        mbox_sha1sum: { type: string, pattern: '^[0-9a-fA-F]{40}$' }
        openid: { type: string, format: iri }
        account: { $ref: '#/components/schemas/XapiAccount' }
        member:
          type: array
          description: Group members only.
          items: { $ref: '#/components/schemas/XapiAgent' }

    XapiPerson:
      type: object
      description: |
        Everything this LRS knows about one agent. Unlike an Agent, each
        identifying property is an *array* — the union of the values seen across
        statements sharing that inverse-functional identifier.
      required: [objectType]
      properties:
        objectType: { type: string, enum: [Person] }
        name:
          type: array
          items: { type: string }
        mbox:
          type: array
          items: { type: string, format: mailto }
        mbox_sha1sum:
          type: array
          items: { type: string, pattern: '^[0-9a-fA-F]{40}$' }
        openid:
          type: array
          items: { type: string, format: iri }
        account:
          type: array
          items: { $ref: '#/components/schemas/XapiAccount' }

    XapiVerb:
      type: object
      required: [id]
      properties:
        id: { type: string, format: iri }
        display: { $ref: '#/components/schemas/XapiLanguageMap' }

    XapiActivity:
      type: object
      required: [id]
      properties:
        objectType: { type: string, enum: [Activity] }
        id: { type: string, format: iri }
        definition:
          type: object
          additionalProperties: true

    XapiStatementRef:
      type: object
      required: [objectType, id]
      properties:
        objectType: { type: string, enum: [StatementRef] }
        id: { type: string, format: uuid }

    XapiScore:
      type: object
      properties:
        scaled: { type: number, minimum: -1, maximum: 1 }
        raw: { type: number }
        min: { type: number }
        max: { type: number }

    XapiResult:
      type: object
      properties:
        score: { $ref: '#/components/schemas/XapiScore' }
        success: { type: boolean }
        completion: { type: boolean }
        response: { type: string }
        duration:
          type: string
          description: ISO 8601 duration, e.g. `PT1H30M`.
        extensions:
          type: object
          additionalProperties: true

    XapiContext:
      type: object
      properties:
        registration: { type: string, format: uuid }
        instructor: { $ref: '#/components/schemas/XapiAgent' }
        team: { $ref: '#/components/schemas/XapiAgent' }
        contextActivities:
          type: object
          additionalProperties: true
        revision:
          type: string
          description: Only allowed when the object is an Activity.
        platform:
          type: string
          description: Only allowed when the object is an Activity.
        language: { type: string }
        statement: { $ref: '#/components/schemas/XapiStatementRef' }
        extensions:
          type: object
          additionalProperties: true

    XapiStatement:
      type: object
      required: [actor, verb, object]
      properties:
        id:
          type: string
          format: uuid
          description: Assigned by the LRS when omitted.
        actor: { $ref: '#/components/schemas/XapiAgent' }
        verb: { $ref: '#/components/schemas/XapiVerb' }
        object:
          description: An Activity, Agent, Group, StatementRef or SubStatement.
          oneOf:
            - $ref: '#/components/schemas/XapiActivity'
            - $ref: '#/components/schemas/XapiAgent'
            - $ref: '#/components/schemas/XapiStatementRef'
            - type: object
              additionalProperties: true
        result: { $ref: '#/components/schemas/XapiResult' }
        context: { $ref: '#/components/schemas/XapiContext' }
        timestamp:
          type: string
          format: date-time
          description: Defaults to the time of storage.
        stored:
          type: string
          format: date-time
          readOnly: true
        authority:
          allOf: [{ $ref: '#/components/schemas/XapiAgent' }]
          readOnly: true
          description: Always overwritten by the LRS with an agent identifying this tenant.
        version:
          type: string
          readOnly: true
        attachments:
          type: array
          items: { $ref: '#/components/schemas/XapiAttachment' }

    XapiAttachment:
      type: object
      required: [usageType, display, contentType, length, sha2]
      properties:
        usageType:
          type: string
          format: iri
          description: Use `http://adlnet.gov/expapi/attachments/signature` for a JWS statement signature.
        display:
          type: object
          additionalProperties: { type: string }
        description:
          type: object
          additionalProperties: { type: string }
        contentType: { type: string }
        length: { type: integer, minimum: 0 }
        sha2:
          type: string
          description: Hex SHA-2 digest of the body; matches the part's `X-Experience-API-Hash`.
        fileUrl:
          type: string
          format: iri
          description: Where the body can be fetched; when set, the body need not be uploaded.

    XapiStatementResult:
      type: object
      required: [statements, more]
      properties:
        statements:
          type: array
          items: { $ref: '#/components/schemas/XapiStatement' }
        more:
          type: string
          description: Relative URL of the next page, or an empty string when the result set is exhausted.

    # ── Certificates ─────────────────────────────────────────────────────
    Certificate:
      type: object
      required:
        - id
        - serial
        - status
        - attemptId
        - courseId
        - learnerId
        - learnerName
        - courseTitle
        - scorePercent
        - completedAt
        - issuedAt
        - revokedAt
        - revokedReason
        - pdfUrl
      properties:
        id: { type: string }
        serial:
          type: string
          description: Public verification code printed on the PDF.
          example: 7KQ2-M9XD-4TPA
        status: { type: string, enum: [valid, revoked] }
        attemptId: { type: string }
        courseId: { type: string }
        learnerId:
          type: [string, 'null']
          description: The learner's id in your system.
        learnerName:
          type: string
          description: As printed — the learner's name at issue time, or their id if they had none.
        courseTitle:
          type: string
          description: The course title at issue time.
        scorePercent:
          type: [number, 'null']
          minimum: 0
          maximum: 100
          description: Scaled score × 100, else raw within min/max (0–100 by default).
        completedAt: { type: string, format: date-time }
        issuedAt: { type: string, format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        revokedReason: { type: [string, 'null'] }
        pdfUrl:
          type: string
          description: Path of the PDF (API key auth), relative to the server origin.

    CertificateVerification:
      type: object
      required: [valid, serial, status, learnerName, courseTitle, issuer, completedAt, issuedAt, revokedAt]
      properties:
        valid: { type: boolean }
        serial: { type: string }
        status: { type: string, enum: [valid, revoked] }
        learnerName: { type: string }
        courseTitle: { type: string }
        issuer:
          type: string
          description: The issuing organization (`CERTIFICATE_ISSUER`).
        completedAt: { type: string, format: date-time }
        issuedAt: { type: string, format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }

    # ── Webhooks ─────────────────────────────────────────────────────────
    WebhookEventType:
      type: string
      enum:
        - attempt.started
        - attempt.suspended
        - attempt.terminated
        - course.completed
        - course.passed
        - course.failed
        - score.updated
        - objective.mastered
        - certificate.issued
        - certificate.revoked
        - cmi5.session.terminated
        - cmi5.session.abandoned
        - cmi5.au.waived
        - cmi5.block.satisfied
        - cmi5.course.satisfied
        - xapi.statement.stored
        - webhook.test

    WebhookEndpoint:
      type: object
      required: [id, url, description, events, enabled, createdAt, updatedAt]
      properties:
        id: { type: string }
        url: { type: string, format: uri }
        description: { type: [string, 'null'] }
        events:
          type: array
          description: Subscribed event types, or `["*"]` for all.
          items: { type: string }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    WebhookEndpointWithSecret:
      allOf:
        - $ref: '#/components/schemas/WebhookEndpoint'
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: HMAC-SHA256 signing secret. Store it; it is not shown again.
              example: whsec_3kq9…

    WebhookEndpointCreate:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
          description: http(s) URL. Private / loopback addresses are refused unless `WEBHOOK_ALLOW_PRIVATE_URLS` is set.
        events:
          type: array
          minItems: 1
          description: Event types (see `WebhookEventType`), or `*` for all.
          items: { type: string }
        description: { type: [string, 'null'], maxLength: 500 }
        enabled: { type: boolean, default: true }

    WebhookEndpointUpdate:
      type: object
      properties:
        url: { type: string, format: uri }
        events:
          type: array
          minItems: 1
          items: { type: string }
        description: { type: [string, 'null'], maxLength: 500 }
        enabled: { type: boolean }

    WebhookDeliveryStatus:
      type: string
      enum: [PENDING, SUCCEEDED, FAILED]
      description: '`FAILED` is the dead-letter state: out of retries until retried by hand.'

    WebhookPayload:
      type: object
      required: [id, type, createdAt, data]
      description: The JSON body of every delivery.
      properties:
        id:
          type: string
          description: Event id, the same on every endpoint's copy and every retry. Dedupe on it.
        type: { $ref: '#/components/schemas/WebhookEventType' }
        createdAt: { type: string, format: date-time }
        data:
          type: object
          additionalProperties: true
          description: |
            Event-specific. Attempt events carry `attemptId`, `courseId`, `scoId`,
            `learnerId`, `completionStatus`, `successStatus`, `score` and
            `totalTimeSeconds`; cmi5 events carry `registrationId`, `courseId`,
            `actor`, and the `au` or `block` concerned.

    WebhookDelivery:
      type: object
      required:
        - id
        - endpointId
        - eventId
        - eventType
        - status
        - attempts
        - nextAttemptAt
        - lastAttemptAt
        - lastStatusCode
        - lastError
        - lastResponse
        - deliveredAt
        - createdAt
        - payload
      properties:
        id: { type: string }
        endpointId: { type: string }
        eventId: { type: string }
        eventType: { type: string }
        status: { $ref: '#/components/schemas/WebhookDeliveryStatus' }
        attempts: { type: integer }
        nextAttemptAt: { type: [string, 'null'], format: date-time }
        lastAttemptAt: { type: [string, 'null'], format: date-time }
        lastStatusCode: { type: [integer, 'null'] }
        lastError: { type: [string, 'null'] }
        lastResponse:
          type: [string, 'null']
          description: Start of the receiver's last response body.
        deliveredAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        payload: { $ref: '#/components/schemas/WebhookPayload' }

    # ── cmi5 ─────────────────────────────────────────────────────────────
    Cmi5MoveOn:
      type: string
      enum: [Passed, Completed, CompletedAndPassed, CompletedOrPassed, NotApplicable]

    Cmi5LaunchMode:
      type: string
      enum: [Normal, Browse, Review]

    Cmi5Au:
      type: object
      required: [id, publisherId, activityId, title, url, launchMethod, moveOn]
      properties:
        id: { type: string, description: Engine id of the AU. }
        publisherId:
          type: string
          description: AU id from the course structure (the publisher's IRI).
        activityId:
          type: string
          description: Engine-generated activity IRI; the object of every cmi5 defined statement for this AU.
        title: { type: string }
        description: { type: [string, 'null'] }
        url:
          type: string
          description: AU url as declared — relative to the package root, or absolute.
        launchMethod: { type: string, enum: [AnyWindow, OwnWindow] }
        moveOn: { $ref: '#/components/schemas/Cmi5MoveOn' }
        masteryScore: { type: [number, 'null'], minimum: 0, maximum: 1 }
        activityType: { type: [string, 'null'] }
        launchParameters: { type: [string, 'null'] }

    Cmi5StructureNode:
      type: object
      required: [type, id]
      description: An AU reference or a block, in course order. Blocks nest further nodes.
      properties:
        type: { type: string, enum: [au, block] }
        id: { type: string, description: Publisher id of the AU or block. }
        activityId:
          type: string
          description: Blocks only — engine-generated activity IRI, the object of the block's `satisfied` statement.
        title: { type: string }
        description: { type: [string, 'null'] }
        children:
          type: array
          items: { $ref: '#/components/schemas/Cmi5StructureNode' }

    Cmi5Course:
      type: object
      required: [id, publisherId, activityId, title, hosted, aus, structure, createdAt, updatedAt]
      properties:
        id: { type: string }
        publisherId: { type: string, description: Course id from the course structure. }
        activityId:
          type: string
          description: Engine-generated activity IRI used for course-level statements (`satisfied`).
        title: { type: string }
        description: { type: [string, 'null'] }
        hosted:
          type: boolean
          description: True when the engine stores the package files; false for a structure-only import.
        aus:
          type: array
          items: { $ref: '#/components/schemas/Cmi5Au' }
        structure:
          type: array
          items: { $ref: '#/components/schemas/Cmi5StructureNode' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Cmi5CourseListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Cmi5Course' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    Cmi5ValidationReport:
      type: object
      required: [valid, errors]
      properties:
        valid: { type: boolean }
        errors:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              message: { type: string }
        structure:
          description: The parsed course structure, or null when invalid.
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'

    Cmi5RegistrationRequest:
      type: object
      required: [courseId]
      description: Identify the learner with either a full `actor` or a `learnerId`.
      properties:
        courseId: { type: string }
        actor: { $ref: '#/components/schemas/XapiAgent' }
        learnerId:
          type: string
          description: Shorthand for an Agent account on `XAPI_AUTHORITY_HOMEPAGE`.
        learnerName: { type: string }
        learnerPreferences:
          allOf: [{ $ref: '#/components/schemas/Cmi5LearnerPreferences' }]
          description: Optional; replaces the learner's `cmi5LearnerPreferences` agent profile.

    Cmi5LearnerPreferences:
      type: object
      description: The `cmi5LearnerPreferences` Agent Profile document AUs read from the LRS.
      properties:
        languagePreference:
          type: string
          description: Comma-separated RFC 5646 language codes, most preferred first.
          example: fr-FR,en-US
        audioPreference: { type: string, enum: ['on', 'off'] }

    Cmi5LearnerPreferencesRequest:
      description: Identify the learner with either a full `actor` or a `learnerId`. Replaces the stored document.
      allOf:
        - $ref: '#/components/schemas/Cmi5LearnerPreferences'
        - type: object
          properties:
            actor: { $ref: '#/components/schemas/XapiAgent' }
            learnerId: { type: string }
            learnerName: { type: string }

    Cmi5BlockProgress:
      type: object
      required: [publisherId, title, satisfied, satisfiedAt]
      properties:
        publisherId: { type: string }
        title: { type: string }
        satisfied:
          type: boolean
          description: True once every AU and nested block in it is satisfied; the engine then records `satisfied` for the block.
        satisfiedAt: { type: [string, 'null'], format: date-time }

    Cmi5AuProgress:
      type: object
      required: [id, publisherId, title, moveOn, completed, passed, failed, waived, satisfied]
      properties:
        id: { type: string }
        publisherId: { type: string }
        title: { type: string }
        moveOn: { $ref: '#/components/schemas/Cmi5MoveOn' }
        completed: { type: boolean }
        passed: { type: boolean }
        failed: { type: boolean }
        waived: { type: boolean }
        satisfied:
          type: boolean
          description: Whether the AU's moveOn criterion is met.

    Cmi5Registration:
      type: object
      required: [id, courseId, actor, satisfied, satisfiedAt, createdAt, aus, blocks]
      properties:
        id:
          type: string
          format: uuid
          description: The xAPI `registration` every statement in this enrolment carries.
        courseId: { type: string }
        actor: { $ref: '#/components/schemas/XapiAgent' }
        satisfied:
          type: boolean
          description: True once every AU's moveOn criterion is met; the engine then records `satisfied` for the course.
        satisfiedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        aus:
          type: array
          items: { $ref: '#/components/schemas/Cmi5AuProgress' }
        blocks:
          type: array
          description: Every block in the course, in document order.
          items: { $ref: '#/components/schemas/Cmi5BlockProgress' }

    Cmi5LaunchRequest:
      type: object
      required: [auId]
      properties:
        auId:
          type: string
          description: Engine id or publisher id of the AU.
        launchMode:
          allOf: [{ $ref: '#/components/schemas/Cmi5LaunchMode' }]
          default: Normal
        returnUrl:
          type: string
          format: uri
          description: Written to LaunchData as `returnURL`.

    Cmi5LaunchResponse:
      type: object
      required: [url, sessionId, launchMode, launchMethod, expiresAt]
      properties:
        url:
          type: string
          format: uri
          description: |
            The AU launch URL, carrying `endpoint`, `fetch`, `actor`, `registration`
            and `activityId`. Open it in a new window when `launchMethod` is
            `OwnWindow`; otherwise an iframe works too.
        sessionId: { type: string, format: uuid }
        launchMode: { $ref: '#/components/schemas/Cmi5LaunchMode' }
        launchMethod: { type: string, enum: [AnyWindow, OwnWindow] }
        expiresAt: { type: string, format: date-time }

    Cmi5WaiveRequest:
      type: object
      required: [auId, reason]
      properties:
        auId: { type: string }
        reason:
          type: string
          enum: [Tested Out, Equivalent AU, Equivalent Outside Activity, Administrative]

    Cmi5FetchResponse:
      type: object
      required: [auth-token]
      properties:
        auth-token:
          type: string
          description: 'Send as `Authorization: Basic <auth-token>` on every LRS call.'

    Cmi5FetchError:
      type: object
      required: [error-code, error-text]
      properties:
        error-code:
          type: string
          enum: ['1', '2', '3']
          description: '`1` already redeemed, `2` invalid or expired, `3` general error.'
        error-text: { type: string }
