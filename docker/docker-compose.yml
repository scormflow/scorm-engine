services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scormflow
      POSTGRES_PASSWORD: scormflow
      POSTGRES_DB: scormflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scormflow -d scormflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  engine:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://scormflow:scormflow@postgres:5432/scormflow?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string-at-least-32-chars}
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /data/storage
      REDIS_URL: redis://redis:6379
      # Set to `redis` to carry engine events over the bundled Redis (needed
      # once you run more than one engine replica).
      EVENT_BUS_DRIVER: ${EVENT_BUS_DRIVER:-memory}
      # Built-in plugins, comma-separated (e.g. `analytics`).
      PLUGINS: ${PLUGINS:-}
    ports:
      - "3000:3000"
    volumes:
      - engine-storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  engine-storage:
